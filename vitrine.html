<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F0DFD0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17110E" media="(prefers-color-scheme: dark)">
<title>Vitrine — ESPRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══ Reset & tokens ═══ */
:root {
  --bg:#F0DFD0;--surface:#FBF5EF;--ink:#2A1D17;--muted:#74635A;--line:#E2CCBA;
  --accent:#B04E37;--accent-ink:#fff;--accent-soft:#F3D9CF;--accent-2:#E4A558;--accent-3:#A49F4F;
  --radius:16px;--shadow:0 1px 2px rgb(0 0 0/.05),0 6px 18px rgb(80 40 20/.08);
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light dark;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#17110E;--surface:#231A16;--ink:#F0DFD0;--muted:#A8968A;--line:#3A2C25;
  --accent:#E4A558;--accent-ink:#2A1408;--accent-soft:#4A2E1A80;--accent-2:#B04E37;
  --shadow:0 1px 2px rgb(0 0 0/.4);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);min-height:100dvh}
h1,h2,h3,p{margin:0}
a{color:var(--accent);text-decoration:none;font-weight:500}
img{display:block;max-width:100%}
button{cursor:pointer;background:none;border:0;padding:0;font:inherit;color:inherit}

/* ═══ Layout ═══ */
.wrapper{max-width:960px;margin:0 auto;padding:0 20px}
header.hero-bar{padding:calc(env(safe-area-inset-top,0px)+32px) 0 24px;text-align:center}
header.hero-bar .brand{font:.72rem/1 var(--sans);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
header.hero-bar h1{font:700 2.4rem/1.1 var(--serif);letter-spacing:-.01em;color:var(--ink)}
header.hero-bar p{color:var(--muted);max-width:480px;margin:8px auto 0;font-size:.95rem}
@media(min-width:640px){header.hero-bar h1{font-size:3.2rem}}

.nav-pills{display:flex;justify-content:center;gap:8px;margin:24px 0 32px;flex-wrap:wrap}
.nav-pills button{min-height:42px;padding:0 20px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem;transition:all .15s}
.nav-pills button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}

/* ═══ Grid de cards (edições e eventos) ═══ */
.section-title{font:600 1.5rem/1.2 var(--serif);margin:0 0 20px}
.section-title .count{font-size:.85rem;font-weight:400;color:var(--muted);margin-left:8px}

.card-grid{display:grid;grid-template-columns:1fr;gap:24px;margin-bottom:48px}
@media(min-width:540px){.card-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:800px){.card-grid{grid-template-columns:repeat(3,1fr)}}

.vcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.vcard:hover{transform:translateY(-3px);box-shadow:0 4px 24px rgb(80 40 20/.14)}
.vcard .cover{position:relative;aspect-ratio:3/4;background:color-mix(in srgb,var(--accent) 12%,var(--surface));display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.vcard .cover img{width:100%;height:100%;object-fit:cover}
.vcard .cover .ph{font:700 1.6rem var(--serif);color:var(--accent);opacity:.5;text-align:center;padding:20px}
.vcard .cover .badge{position:absolute;top:12px;right:12px;font-size:.7rem;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--accent);color:var(--accent-ink);text-transform:uppercase;letter-spacing:.06em}
.vcard .body{padding:16px;flex:1;display:flex;flex-direction:column;gap:6px}
.vcard .body h3{font:600 1.1rem/1.25 var(--serif)}
.vcard .body .meta{font-size:.82rem;color:var(--muted)}
.vcard .body .desc{font-size:.88rem;color:var(--muted);line-height:1.45;flex:1}
.vcard .body .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{min-height:42px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:.88rem;transition:all .12s}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn:active{transform:scale(.97)}
.btn.small{min-height:36px;padding:0 14px;font-size:.82rem}
.btn svg{flex:none}

/* ═══ Carrossel ═══ */
.carousel-wrap{position:relative;margin-top:8px}
.carousel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px 2px 8px}
.carousel::-webkit-scrollbar{display:none}
.carousel .slide{flex:none;width:clamp(140px,38vw,220px);aspect-ratio:4/3;border-radius:12px;overflow:hidden;scroll-snap-align:start;cursor:pointer;position:relative;border:1px solid var(--line);background:var(--surface)}
.carousel .slide img{width:100%;height:100%;object-fit:cover;transition:transform .2s}
.carousel .slide:hover img{transform:scale(1.04)}
.carousel-arrow{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;z-index:2;color:var(--ink);opacity:.8;transition:opacity .15s}
.carousel-arrow:hover{opacity:1}
.carousel-arrow.left{left:-12px}
.carousel-arrow.right{right:-12px}
@media(max-width:539px){.carousel-arrow{display:none}}

/* ═══ Lightbox ═══ */
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.lightbox.open{opacity:1;pointer-events:auto}
.lightbox img{max-width:92vw;max-height:88vh;border-radius:12px;object-fit:contain;box-shadow:0 0 40px rgba(0,0,0,.5)}
.lightbox .close{position:absolute;top:20px;right:20px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;font-size:1.5rem}
.lightbox .nav-lb{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;font-size:1.3rem}
.lightbox .nav-lb.prev{left:16px}
.lightbox .nav-lb.next{right:16px}
@media(max-width:539px){.lightbox .nav-lb{top:auto;bottom:24px;transform:none}.lightbox .nav-lb.prev{left:calc(50% - 60px)}.lightbox .nav-lb.next{right:calc(50% - 60px)}}

/* ═══ Detail panel (edição aberta) ═══ */
.detail-overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;transform:translateY(100%);transition:transform .3s ease}
.detail-overlay.open{transform:translateY(0)}
.detail-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:16px 20px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px)}
.detail-bar button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface)}
.detail-bar h2{font:600 1.15rem/1.2 var(--serif);flex:1}
.detail-body{max-width:720px;margin:0 auto;padding:0 20px 60px}
.detail-body .pdf-frame{width:100%;aspect-ratio:3/4;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:20px}
.detail-body .pdf-frame iframe{width:100%;height:100%;border:0}

/* ═══ Vitrine v2: faixa, chips, pontinhos, oliva ═══ */
header.hero-bar{position:relative;margin:0 -20px;padding-left:20px;padding-right:20px;border-radius:0 0 28px 28px;
  background:linear-gradient(135deg,#B04E37 0%,#7A3424 70%);color:#F0DFD0;overflow:hidden}
header.hero-bar::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,#E4A55855,transparent 70%);pointer-events:none}
header.hero-bar .brand,header.hero-bar p{color:#F0DFD0cc}
header.hero-bar h1{color:#F0DFD0}
header.hero-bar .stripe{display:flex;justify-content:center;gap:6px;margin-top:16px}
header.hero-bar .stripe i{width:28px;height:4px;border-radius:4px}
@media(min-width:960px){header.hero-bar{margin:0;border-radius:0 0 32px 32px}}
.nav-pills button[data-v=eventos].on{background:var(--accent-3);color:#fff}
.section-title{display:flex;align-items:center;gap:8px;color:var(--accent)}
.section-title.olive{color:var(--accent-3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.75rem;font-weight:500;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,#F0DFD0 70%,var(--surface));color:var(--ink);border:1px solid var(--line)}
@media(prefers-color-scheme:dark){.chip{background:var(--accent-soft)}}
.vcard .body h3{color:var(--accent)}
.vcard.ev .body h3{color:var(--ink)}
.vcard.ev{border-top:4px solid var(--accent-3)}
.vcard .body .desc{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:none}
.vcard .body .actions{margin-top:auto;padding-top:10px}
.btn.outline{border-color:var(--accent-3);color:var(--accent-3)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:all .2s}
.dots i.on{background:var(--accent-2);width:18px;border-radius:4px}
.lightbox .counter{position:absolute;top:28px;left:50%;transform:translateX(-50%);color:#F0DFD0;font-size:.9rem;font-weight:600;background:rgba(255,255,255,.12);padding:4px 14px;border-radius:99px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ═══ Vitrine v3: destaque, busca, capa-revista, compartilhar ═══ */
.destaque{display:grid;gap:20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow);margin:0 0 40px}
@media(min-width:640px){.destaque{grid-template-columns:220px 1fr;padding:28px;gap:32px}}
.destaque .eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-3)}
.destaque h2{font:700 1.7rem/1.15 var(--serif);color:var(--accent);margin:6px 0 8px}
.destaque p.d{color:var(--muted);margin-bottom:14px}
.destaque .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.revista{position:relative;aspect-ratio:3/4;border-radius:10px 14px 14px 10px;overflow:hidden;color:#F0DFD0;
  background:linear-gradient(160deg,#B04E37 0%,#7A3424 85%);display:flex;flex-direction:column;justify-content:space-between;padding:16px;
  box-shadow:inset 6px 0 10px -6px rgb(0 0 0/.45),0 10px 24px rgb(80 40 20/.22)}
.revista::before{content:"";position:absolute;inset:auto -30% -30% auto;width:80%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#E4A55866,transparent 70%)}
.revista small{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;opacity:.85;position:relative}
.revista b{font:700 clamp(2.4rem,9vw,3.4rem)/1 var(--serif);position:relative}
.revista span{font:600 .95rem/1.2 var(--serif);position:relative}
.revista i{position:relative;display:flex;gap:4px}.revista i u{width:18px;height:3px;border-radius:3px;text-decoration:none}
.destaque .revista{max-width:220px;width:100%;margin:0 auto;cursor:pointer}
.vcard .cover.rev{padding:14px;background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.vcard .cover.rev .revista{width:72%;cursor:pointer}
.busca{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 20px}
.busca input,.busca select{min-height:42px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:0 14px;font:inherit;font-size:.9rem}
.busca input{flex:1;min-width:180px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn:focus-visible,.nav-pills button:focus-visible,.revista:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:.88rem;font-weight:500;opacity:0;transition:all .2s;z-index:200;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.detail-body .pdf-frame{aspect-ratio:auto;height:min(78vh,1000px)}
.detail-body .acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}

/* ═══ Empty ═══ */
.empty{text-align:center;color:var(--muted);padding:48px 20px;font-size:1rem}
.empty svg{margin:0 auto 12px;opacity:.35}

/* ═══ Footer ═══ */
footer{text-align:center;padding:32px 20px;color:var(--muted);font-size:.82rem;border-top:1px solid var(--line);margin-top:40px}

/* ═══ Loading ═══ */
.spinner{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:60px auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrapper" id="app">
  <div class="spinner"></div>
</div>

<div class="lightbox" id="lightbox">
  <button class="close" aria-label="Fechar">&times;</button>
  <span class="counter" id="lb-counter"></span>
  <button class="nav-lb prev" aria-label="Anterior">&#8249;</button>
  <img src="" alt="">
  <button class="nav-lb next" aria-label="Próxima">&#8250;</button>
</div>

<div class="detail-overlay" id="detail">
  <div class="detail-bar">
    <button id="detail-close" aria-label="Voltar">&#8249;</button>
    <h2 id="detail-title"></h2>
  </div>
  <div class="detail-body" id="detail-body"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   Vitrine pública — Edições (PDF) e Eventos (fotos)
   Lê dos dados do app (IndexedDB/localStorage) ou da API.
   ═══════════════════════════════════════════════════════════════ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const h = (tag, props, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(c));
  }
  return e;
};
const svgIcon = (d, size = 20) => {
  const ns = 'http://www.w3.org/2000/svg';
  const s = document.createElementNS(ns, 'svg');
  s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('width', size); s.setAttribute('height', size);
  s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor');
  s.setAttribute('stroke-width', '2'); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round');
  const p = document.createElementNS(ns, 'path'); p.setAttribute('d', d); s.append(p);
  return s;
};
const ICONS = {
  book: 'M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14zM6.5 17H20v4H6.5a2.5 2.5 0 0 1 0-4z',
  calendar: 'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z',
  image: 'M3 5h18v14H3zM3 16l5-5 4 4 3-3 6 6',
  file: 'M6 3h9l4 4v14H6zM14 3v5h5',
  left: 'm15 18-6-6 6-6',
  right: 'm9 18 6-6-6-6',
  x: 'M18 6 6 18M6 6l12 12',
  download: 'M12 3v12M7 10l5 5 5-5M5 21h14',
  share: 'M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13',
};

/* ───── Dados ───── */
const DB_NAME = 'espro', KV = 'kv';
let fonte = 'api';                                  // 'api' (servidor) ou 'local' (navegador de quem usa o app)

/* Mesmas regras do servidor: só edições publicadas com PDF, álbuns não ocultos e
   eventos da Agenda marcados "Mostrar na vitrine". */
function filtrar(state) {
  return {
    ...state,
    edicoes: (state.edicoes || []).filter(e => e && e.pdf && e.status === 'publicada'),
    galeria: (state.galeria || []).filter(g => g && !g.oculto),
    eventos: (state.eventos || []).filter(e => e && e.tipo === 'evento' && e.vitrine === true),
  };
}

async function carregarDados() {
  try {
    const res = await fetch('/api/vitrine', { cache: 'no-store' });
    if (res.ok) {
      const d = await res.json();
      if (d && d.ok) return filtrar({ edicoes: d.edicoes, galeria: d.galeria, eventos: d.eventos, empresa: { nome: 'ESPRO' } });
    }
  } catch {}
  fonte = 'local';
  let state = null;
  try {
    const db = await new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(KV);
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    state = await new Promise((res, rej) => {
      const r = db.transaction(KV).objectStore(KV).get('state');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  } catch {}
  if (!state) try { state = JSON.parse(localStorage.getItem('espro.v1')); } catch {}
  return filtrar(state || { empresa: { nome: 'ESPRO' } });
}

/* 'img:<id>' → imagem local (app) ou pública (/api/pm) */
function fotoSrc(f) {
  const s = typeof f === 'string' ? f : f?.src;
  if (!s) return '';
  if (s.startsWith('img:')) return window._midia?.[s.slice(4)] || (fonte === 'api' ? '/api/pm/' + s.slice(4) : '');
  return s;
}
const srcDe = fotoSrc;
const pdfUrl = (e, baixar) => `/api/vitrine/pdf/${encodeURIComponent(e.id)}${baixar ? '?baixar=1' : ''}`;
const tituloEd = e => (e.nome ? `Edição nº ${e.numero} — ${e.nome}` : `Edição nº ${e.numero}`);
const mb = b => (b / 1048576).toFixed(1).replace('.', ',') + ' MB';

let toastT;
function toast(msg) {
  let t = $('.toast'); if (!t) { t = h('div', { class: 'toast', role: 'status', 'aria-live': 'polite' }); document.body.append(t); }
  t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200);
}
async function compartilhar(titulo, hash) {
  const link = location.origin + location.pathname + hash;
  if (navigator.share) { try { await navigator.share({ title: titulo, url: link }); return; } catch { return; } }
  try { await navigator.clipboard.writeText(link); toast('Link copiado'); } catch { prompt('Copie o link:', link); }
}

/* ───── Lightbox ───── */
let lbImgs = [], lbIdx = 0;
const lb = $('#lightbox'), lbImg = $('img', lb);
function openLb(imgs, idx) {
  lbImgs = imgs; lbIdx = idx;
  showLb();
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLb() { lb.classList.remove('open'); document.body.style.overflow = ''; }
function showLb() { lbImg.src = lbImgs[lbIdx]; $('#lb-counter').textContent = `${lbIdx + 1} / ${lbImgs.length}`; }
function navLb(dir) { lbIdx = (lbIdx + dir + lbImgs.length) % lbImgs.length; showLb(); }
let lbX = null;
lb.addEventListener('touchstart', e => { lbX = e.touches[0].clientX; }, { passive: true });
lb.addEventListener('touchend', e => { if (lbX == null) return; const dx = e.changedTouches[0].clientX - lbX; if (Math.abs(dx) > 50) navLb(dx < 0 ? 1 : -1); lbX = null; });
$('.close', lb).onclick = closeLb;
$('.prev', lb).onclick = () => navLb(-1);
$('.next', lb).onclick = () => navLb(1);
lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') navLb(-1);
  if (e.key === 'ArrowRight') navLb(1);
});

/* ───── Detail overlay ───── */
const detail = $('#detail'), detailTitle = $('#detail-title'), detailBody = $('#detail-body');
$('#detail-close').onclick = () => { detail.classList.remove('open'); document.body.style.overflow = ''; };

function openDetail(titulo, conteudo) {
  detailTitle.textContent = titulo;
  detailBody.replaceChildren(conteudo);
  detail.classList.add('open');
  document.body.style.overflow = 'hidden';
  detail.scrollTop = 0;
}

/* ───── Carousel builder ───── */
function buildCarousel(imgs, openable = true) {
  const wrap = h('div', { class: 'carousel-wrap' });
  const track = h('div', { class: 'carousel' });
  imgs.forEach((src, i) => {
    const slide = h('div', { class: 'slide', onclick: openable ? () => openLb(imgs, i) : null },
      h('img', { src, alt: `Foto ${i + 1}`, loading: 'lazy' }));
    track.append(slide);
  });
  const left = h('button', { class: 'carousel-arrow left', 'aria-label': 'Anterior', onclick: () => track.scrollBy({ left: -240, behavior: 'smooth' }) },
    svgIcon(ICONS.left, 18));
  const right = h('button', { class: 'carousel-arrow right', 'aria-label': 'Próxima', onclick: () => track.scrollBy({ left: 240, behavior: 'smooth' }) },
    svgIcon(ICONS.right, 18));
  wrap.append(left, track, right);
  if (imgs.length > 1) {
    const dots = h('div', { class: 'dots' }, ...imgs.map((_, i) => h('i', { class: i ? '' : 'on' })));
    track.addEventListener('scroll', () => {
      const w = track.scrollWidth - track.clientWidth;
      const i = w > 0 ? Math.round(track.scrollLeft / w * (imgs.length - 1)) : 0;
      [...dots.children].forEach((d, j) => d.classList.toggle('on', j === i));
    }, { passive: true });
    wrap.append(dots);
  }
  return wrap;
}

/* ───── Formato de data ───── */
const fmtData = s => {
  if (!s) return '';
  try { return new Date(s + 'T00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' }); }
  catch { return s; }
};

/* ═══ Render ═══ */
let filtro = 'todos', busca = '', ano = '', STATE = null;
const norm = x => String(x || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

/* capa estilo revista (as edições são PDF, então a capa é desenhada) */
const capaRevista = (e, empresa, onclick) => h('div', { class: 'revista', role: 'button', tabindex: '0', 'aria-label': 'Ler ' + tituloEd(e), onclick,
  onkeydown: ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); onclick(); } } },
  h('small', {}, empresa), h('div', {}, h('b', {}, `nº ${e.numero}`), e.nome ? h('span', { style: 'display:block;margin-top:6px' }, e.nome) : null),
  h('i', {}, ...['#F0DFD0', '#E4A558', '#A49F4F'].map(c => h('u', { style: 'background:' + c }))));

const botoesEd = (e, small) => [
  h('button', { class: 'btn primary' + (small ? ' small' : ''), onclick: () => abrirDetalhe(e) }, svgIcon(ICONS.book, 16), 'Ler agora'),
  h('a', { class: 'btn outline' + (small ? ' small' : ''), href: pdfUrl(e, true), download: `revista-edicao-${e.numero}.pdf` }, svgIcon(ICONS.download, 16), 'Baixar PDF'),
  h('button', { class: 'btn ghost' + (small ? ' small' : ''), 'aria-label': 'Compartilhar ' + tituloEd(e), onclick: () => compartilhar(tituloEd(e), '#edicao-' + e.numero) }, svgIcon(ICONS.share, 16), small ? null : 'Compartilhar')];

async function iniciar() {
  STATE = await carregarDados();
  window._midia = STATE.midia || {};
  render();
  abrirPorHash();
}

function render() {
  const state = STATE, app = $('#app'), empresa = state.empresa?.nome || 'ESPRO';
  const todas = [...state.edicoes].sort((a, b) => b.numero - a.numero);
  const anos = [...new Set(todas.map(e => (e.data || '').slice(0, 4)).filter(Boolean))].sort().reverse();
  const q = norm(busca.trim());
  const edicoes = todas.filter(e => (!ano || (e.data || '').startsWith(ano)) && (!q || norm(`${tituloEd(e)} ${e.descricao || ''}`).includes(q)));
  const destaque = todas[0];

  const galerias = state.galeria;
  const eventos = [
    ...galerias.map(g => ({ ...g, _tipo: 'galeria' })),
    ...state.eventos.filter(ev => !galerias.some(g => g.eventoId === ev.id))
      .map(ev => ({ id: ev.id, titulo: ev.titulo, data: ev.data, descricao: ev.descricao || '', fotos: [], _tipo: 'evento' })),
  ].sort((a, b) => (b.data || '').localeCompare(a.data || ''));

  const mostraEdicoes = filtro !== 'eventos', mostraEventos = filtro !== 'edicoes';

  const header = h('header', { class: 'hero-bar' },
    h('div', { class: 'brand' }, empresa),
    h('h1', {}, 'Vitrine'),
    h('p', {}, 'Nossas edições da revista e registros dos eventos — tudo em um só lugar.'),
    h('div', { class: 'stripe' }, ...['#F0DFD0', '#E4A558', '#A49F4F'].map(c => h('i', { style: 'background:' + c }))));

  const pills = h('div', { class: 'nav-pills', role: 'tablist' },
    ...[['todos', 'Tudo'], ['edicoes', `Edições (${todas.length})`], ['eventos', `Eventos (${eventos.length})`]]
      .map(([v, label]) => h('button', { 'data-v': v, role: 'tab', 'aria-selected': String(v === filtro), class: v === filtro ? 'on' : '', onclick: () => { filtro = v; render(); } }, label)));

  const destaqueSec = mostraEdicoes && destaque && !q && !ano ? h('section', { class: 'destaque', id: 'edicao-' + destaque.numero },
    capaRevista(destaque, empresa, () => abrirDetalhe(destaque)),
    h('div', {},
      h('p', { class: 'eyebrow' }, 'Edição mais recente'),
      h('h2', {}, tituloEd(destaque)),
      h('div', { class: 'chips' },
        destaque.data ? h('span', { class: 'chip' }, '📅 ' + fmtData(destaque.data)) : null,
        destaque.pdf?.tamanho ? h('span', { class: 'chip' }, '📄 ' + mb(destaque.pdf.tamanho)) : null),
      destaque.descricao ? h('p', { class: 'd', style: 'margin-top:12px' }, destaque.descricao) : null,
      h('div', { class: 'acts' }, ...botoesEd(destaque)))) : null;

  const anteriores = destaqueSec ? edicoes.filter(e => e !== destaque) : edicoes;
  const filtros = todas.length > 3 ? h('div', { class: 'busca' },
    h('input', { type: 'search', placeholder: 'Buscar edição…', value: busca, 'aria-label': 'Buscar edição',
      oninput: ev => { busca = ev.target.value; clearTimeout(window._bt); window._bt = setTimeout(() => { render(); const i = $('.busca input'); i?.focus(); i?.setSelectionRange(i.value.length, i.value.length); }, 250); } }),
    anos.length > 1 ? h('select', { 'aria-label': 'Ano', onchange: ev => { ano = ev.target.value; render(); } },
      h('option', { value: '' }, 'Todos os anos'), ...anos.map(a => { const o = h('option', { value: a }, a); o.selected = a === ano; return o; })) : null) : null;

  const edicoesSection = mostraEdicoes && todas.length ? h('section', {},
    destaqueSec,
    anteriores.length || q || ano ? h('h2', { class: 'section-title' }, svgIcon(ICONS.book, 22), destaqueSec ? ' Edições anteriores ' : ' Edições ', h('span', { class: 'count' }, `${anteriores.length}`)) : null,
    filtros,
    anteriores.length ? h('div', { class: 'card-grid' }, ...anteriores.map(e => h('article', { class: 'vcard', id: 'edicao-' + e.numero },
      h('div', { class: 'cover rev' }, capaRevista(e, empresa, () => abrirDetalhe(e))),
      h('div', { class: 'body' },
        h('h3', {}, tituloEd(e)),
        h('div', { class: 'chips' },
          e.data ? h('span', { class: 'chip' }, '📅 ' + fmtData(e.data)) : null,
          e.pdf?.tamanho ? h('span', { class: 'chip' }, '📄 ' + mb(e.pdf.tamanho)) : null),
        e.descricao ? h('p', { class: 'desc' }, e.descricao) : null,
        h('div', { class: 'actions' }, ...botoesEd(e, true))))))
      : (q || ano) ? h('p', { class: 'empty' }, 'Nenhuma edição com essa busca.') : null) : null;

  const eventosSection = mostraEventos && eventos.length ? h('section', {},
    h('h2', { class: 'section-title olive' }, svgIcon(ICONS.image, 22), ' Eventos ', h('span', { class: 'count' }, `${eventos.length}`)),
    h('div', { class: 'card-grid' }, ...eventos.map(ev => {
      const fotos = (ev.fotos || []).map(fotoSrc).filter(Boolean), capa = fotos[0] || '';
      return h('article', { class: 'vcard ev' },
        h('div', { class: 'cover', style: 'aspect-ratio:16/10;cursor:' + (capa ? 'zoom-in' : 'default'), onclick: capa ? () => openLb(fotos, 0) : null },
          capa ? h('img', { src: capa, alt: ev.titulo, loading: 'lazy' }) : h('div', { class: 'ph' }, svgIcon(ICONS.calendar, 48)),
          ev.data ? h('span', { class: 'badge', style: 'background:var(--accent-3);color:#fff' }, fmtData(ev.data).split(' de ').slice(0, 2).join(' ')) : null),
        h('div', { class: 'body' },
          h('h3', {}, ev.titulo),
          h('div', { class: 'chips' },
            ev.data ? h('span', { class: 'chip' }, '📅 ' + fmtData(ev.data)) : null,
            fotos.length ? h('span', { class: 'chip' }, `📸 ${fotos.length} foto${fotos.length > 1 ? 's' : ''}`) : null),
          ev.descricao ? h('p', { class: 'desc' }, ev.descricao) : null,
          fotos.length > 1 ? buildCarousel(fotos) : null));
    }))) : null;

  const vazio = !edicoesSection && !eventosSection;
  app.replaceChildren(...[
    header, pills, edicoesSection, eventosSection,
    vazio ? h('div', { class: 'empty' }, svgIcon(ICONS.image, 48), h('p', {}, 'Nada publicado aqui ainda.'), h('p', {}, 'Edições e eventos aparecem quando forem publicados no app.')) : null,
    h('footer', {}, h('p', {}, `${empresa} · Vitrine de publicações`), h('p', {}, 'Feito com ESPRO Frame'))].filter(Boolean));
}

/* ───── Abrir edição (PDF público, sem login) ───── */
function abrirDetalhe(e) {
  history.replaceState(null, '', '#edicao-' + e.numero);
  const url = pdfUrl(e);
  const conteudo = h('div', {},
    h('p', { class: 'meta', style: 'margin-bottom:12px;color:var(--muted)' }, [fmtData(e.data), e.pdf?.tamanho ? mb(e.pdf.tamanho) : ''].filter(Boolean).join(' · ')),
    e.descricao ? h('p', { style: 'margin-bottom:16px' }, e.descricao) : null,
    h('div', { class: 'acts' },
      h('a', { class: 'btn primary', href: url, target: '_blank', rel: 'noopener' }, svgIcon(ICONS.file, 16), 'Abrir em tela cheia'),
      h('a', { class: 'btn outline', href: pdfUrl(e, true), download: `revista-edicao-${e.numero}.pdf` }, svgIcon(ICONS.download, 16), 'Baixar PDF'),
      h('button', { class: 'btn ghost', onclick: () => compartilhar(tituloEd(e), '#edicao-' + e.numero) }, svgIcon(ICONS.share, 16), 'Compartilhar')),
    h('div', { class: 'pdf-frame' }, h('iframe', { src: url, title: 'PDF ' + tituloEd(e), loading: 'lazy' })),
    h('p', { style: 'font-size:.82rem;color:var(--muted)' }, 'No celular, se o PDF não aparecer aqui, toque em "Abrir em tela cheia".'));
  openDetail(tituloEd(e), conteudo);
}
$('#detail-close').addEventListener('click', () => history.replaceState(null, '', location.pathname));
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && detail.classList.contains('open') && !lb.classList.contains('open')) $('#detail-close').click(); });

/* link direto: vitrine.html#edicao-3 abre a edição nº 3 */
function abrirPorHash() {
  const m = /^#edicao-(\d+)$/.exec(location.hash);
  const e = m && STATE.edicoes.find(x => String(x.numero) === m[1]);
  if (e) abrirDetalhe(e);
}
window.addEventListener('hashchange', abrirPorHash);

iniciar();
</script>
