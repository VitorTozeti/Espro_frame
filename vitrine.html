<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F0DFD0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17110E" media="(prefers-color-scheme: dark)">
<meta name="description" content="Revista ESPRO — todas as edições e os registros dos nossos eventos.">
<title>Revista ESPRO — Vitrine</title>
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;0,9..144,900;1,9..144,400;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═════════ Marca ESPRO: terracota · âmbar · oliva · creme ═════════ */
:root{
  --terracota:#B04E37;--terracota-esc:#7A3424;--ambar:#E4A558;--oliva:#A49F4F;--oliva-esc:#6B6733;--creme:#F0DFD0;
  --papel:#F6EBE0;--papel-2:#EFDFD0;--tinta:#231915;--tinta-2:#5E4C43;--fio:#D9C3B0;
  --destaque:var(--terracota);--sobre-destaque:#FFF7F0;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --larg:1180px;
  color-scheme:light dark;
}
@media(prefers-color-scheme:dark){:root{
  --papel:#16100D;--papel-2:#1F1713;--tinta:#F0DFD0;--tinta-2:#B9A597;--fio:#3A2C25;
  --destaque:#E4A558;--sobre-destaque:#2A1408;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--papel);color:var(--tinta);font:400 16px/1.6 var(--sans);min-height:100dvh;
  background-image:radial-gradient(rgb(122 52 36/.035) 1px,transparent 1px);background-size:4px 4px}
h1,h2,h3,p,figure{margin:0}
a{color:inherit}
img{display:block;max-width:100%}
button{cursor:pointer;background:none;border:0;padding:0;font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ambar);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--larg);margin:0 auto;padding:0 clamp(18px,4vw,40px)}
.kicker{font:700 .7rem/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--oliva)}
@media(prefers-color-scheme:dark){.kicker{color:#C9C37A}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ═════════ Barra superior ═════════ */
.topo{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--papel) 88%,transparent);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--fio);transition:box-shadow .2s}
.topo.sombra{box-shadow:0 6px 20px rgb(60 30 15/.08)}
.topo .wrap{display:flex;align-items:center;gap:16px;height:60px}
.topo .marca{font:900 1.35rem/1 var(--serif);letter-spacing:-.02em;color:var(--terracota);text-decoration:none;opacity:0;transition:opacity .2s}
@media(prefers-color-scheme:dark){.topo .marca{color:var(--ambar)}}
.topo.sombra .marca{opacity:1}
.topo nav{display:flex;gap:4px;margin-left:auto}
.topo nav a{font:600 .82rem/1 var(--sans);letter-spacing:.04em;text-decoration:none;padding:10px 14px;border-radius:99px;color:var(--tinta-2);min-height:40px;display:inline-flex;align-items:center}
.topo nav a:hover{color:var(--tinta);background:var(--papel-2)}
.topo nav a.on{color:var(--tinta);box-shadow:inset 0 -2px 0 var(--terracota);border-radius:0}

/* ═════════ Cabeçalho (nameplate) ═════════ */
.cabeca{text-align:center;padding:clamp(28px,6vw,56px) 0 clamp(20px,4vw,32px)}
.cabeca .linha-topo{display:flex;justify-content:space-between;align-items:center;gap:12px;font:600 .72rem/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-2);
  border-top:3px solid var(--tinta);border-bottom:1px solid var(--tinta);padding:9px 0}
.cabeca .linha-topo span:nth-child(2){display:none}
@media(min-width:720px){.cabeca .linha-topo span:nth-child(2){display:inline}}
.cabeca h1{font:900 clamp(4.6rem,19vw,11.5rem)/.86 var(--serif);letter-spacing:-.045em;color:var(--terracota);margin:clamp(14px,3vw,26px) 0 6px;font-variation-settings:"opsz" 144}
@media(prefers-color-scheme:dark){.cabeca h1{color:var(--ambar)}}
.cabeca .lema{font:italic 400 clamp(1rem,2.4vw,1.3rem)/1.4 var(--serif);color:var(--tinta-2)}
.cabeca .faixa{display:flex;justify-content:center;gap:6px;margin-top:18px}
.cabeca .faixa i{width:44px;height:5px;border-radius:2px}

/* ═════════ Capa desenhada (as edições são PDF) ═════════ */
.capa{--c1:var(--terracota);--c2:var(--terracota-esc);--ac:var(--ambar);
  position:relative;aspect-ratio:3/4;border-radius:3px 6px 6px 3px;overflow:hidden;color:#FFF5EC;isolation:isolate;
  background:linear-gradient(165deg,var(--c1) 0%,var(--c2) 100%);
  box-shadow:inset 8px 0 12px -8px rgb(0 0 0/.5),inset -1px 0 0 rgb(255 255 255/.12),0 1px 2px rgb(0 0 0/.12),0 18px 40px -12px rgb(70 30 15/.45);
  display:flex;flex-direction:column;padding:8% 9%;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s;container-type:inline-size}
.capa::before{content:"";position:absolute;z-index:-1;width:95%;aspect-ratio:1;right:-38%;bottom:-22%;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--ac) 70%,transparent),transparent 68%)}
.capa::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgb(0 0 0/.18),transparent 6%,transparent 94%,rgb(255 255 255/.05));pointer-events:none}
.capa .np{font:900 26cqi/.8 var(--serif);letter-spacing:-.05em;font-variation-settings:"opsz" 144}
.capa .np-sub{display:flex;justify-content:space-between;font:700 4.2cqi/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;border-top:1px solid rgb(255 245 236/.55);border-bottom:1px solid rgb(255 245 236/.55);padding:2.6cqi 0;margin-top:3cqi;opacity:.92}
.capa .num{margin-top:auto;font:800 30cqi/.85 var(--serif);letter-spacing:-.04em;color:var(--ac)}
.capa .num small{font-size:.32em;letter-spacing:0;vertical-align:.95em;margin-right:.08em;color:#FFF5EC}
.capa .tit{font:italic 600 8.5cqi/1.1 var(--serif);margin-top:3cqi;max-width:90%}
.capa .chamadas{margin-top:5cqi;display:flex;gap:2.4cqi}
.capa .chamadas i{height:1.3cqi;border-radius:2px;background:rgb(255 245 236/.55)}
.capa .chamadas i:first-child{width:22%;background:var(--ac)}.capa .chamadas i:nth-child(2){width:36%}.capa .chamadas i:nth-child(3){width:14%}
.capa.t1{--c1:#A49F4F;--c2:#5C5829;--ac:#F0DFD0}
.capa.t2{--c1:#7A3424;--c2:#3E1A12;--ac:#E4A558}
.capa.t3{--c1:#C9853D;--c2:#8A4A22;--ac:#FFF1E2}
a.capa-link{display:block;text-decoration:none;border-radius:6px}
a.capa-link:hover .capa,a.capa-link:focus-visible .capa{transform:translateY(-6px) rotate(-.6deg);box-shadow:inset 8px 0 12px -8px rgb(0 0 0/.5),0 30px 50px -16px rgb(70 30 15/.55)}

/* ═════════ Capa da edição atual ═════════ */
.atual{display:grid;gap:clamp(26px,5vw,64px);align-items:center;padding:clamp(18px,4vw,40px) 0 clamp(40px,7vw,80px)}
@media(min-width:820px){.atual{grid-template-columns:minmax(280px,420px) 1fr}}
.atual .capa-link{max-width:420px;width:82%;margin:0 auto}
@media(min-width:820px){.atual .capa-link{width:100%}}
.atual h2{font:800 clamp(2.1rem,5.4vw,3.9rem)/1.02 var(--serif);letter-spacing:-.03em;margin:14px 0 16px;text-wrap:balance}
.atual h2 em{font-style:italic;font-weight:400;color:var(--terracota)}
@media(prefers-color-scheme:dark){.atual h2 em{color:var(--ambar)}}
.atual .deck{font:400 clamp(1.08rem,2.1vw,1.3rem)/1.55 var(--serif);color:var(--tinta-2);max-width:34em}
.atual .deck::first-letter{font:800 3.1em/.8 var(--serif);float:left;margin:.08em .1em 0 0;color:var(--terracota)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:20px;font:600 .74rem/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-2)}
.meta span+span::before{content:"·";margin-right:18px;color:var(--fio)}
.acoes{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;margin-top:28px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:0 24px;border-radius:99px;font:600 .92rem/1 var(--sans);text-decoration:none;transition:transform .15s,background .15s,box-shadow .15s}
.btn.cheio{background:var(--terracota);color:#FFF7F0;box-shadow:0 8px 20px -8px rgb(176 78 55/.7)}
.btn.cheio:hover{background:var(--terracota-esc)}
@media(prefers-color-scheme:dark){.btn.cheio{background:var(--ambar);color:#2A1408}.btn.cheio:hover{background:#F0B66C}}
.btn:active{transform:scale(.97)}
.link{display:inline-flex;align-items:center;gap:8px;min-height:44px;font:600 .9rem/1 var(--sans);text-decoration:none;color:var(--tinta);
  background:linear-gradient(currentColor,currentColor) 0 calc(100% - 10px)/100% 1px no-repeat;transition:background-size .2s}
.link:hover{background-size:0 1px;background-position:100% calc(100% - 10px)}

/* ═════════ Seções ═════════ */
.secao{padding:clamp(36px,6vw,64px) 0}
.secao-cab{display:grid;grid-template-columns:auto 1fr;align-items:end;gap:6px 18px;border-top:3px solid var(--tinta);padding-top:14px;margin-bottom:clamp(24px,4vw,40px)}
.secao-cab .n{font:800 clamp(2.4rem,6vw,3.6rem)/.8 var(--serif);color:var(--ambar);grid-row:span 2}
.secao-cab h2{font:800 clamp(1.7rem,4vw,2.5rem)/1 var(--serif);letter-spacing:-.02em}
.secao-cab p{color:var(--tinta-2);font-size:.92rem}
.secao.eventos .secao-cab{border-top-color:var(--oliva)}
.secao.eventos .secao-cab .n{color:var(--oliva)}

/* ═════════ Ferramentas (busca/ano) ═════════ */
.ferr{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:-8px 0 30px}
.ferr label{position:relative;flex:1;min-width:200px;max-width:380px}
.ferr input{width:100%;min-height:46px;border:0;border-bottom:1.5px solid var(--tinta-2);background:transparent;color:var(--tinta);font:400 1.05rem var(--serif);padding:0 4px 0 30px}
.ferr input:focus{outline:none;border-bottom-color:var(--terracota)}
.ferr label svg{position:absolute;left:2px;top:13px;color:var(--tinta-2)}
.anos{display:flex;gap:4px;flex-wrap:wrap}
.anos button{min-height:40px;padding:0 14px;border-radius:99px;font:600 .82rem var(--sans);color:var(--tinta-2);border:1px solid var(--fio)}
.anos button.on{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}

/* ═════════ Arquivo de edições ═════════ */
.estante{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(26px,4vw,48px) clamp(16px,3vw,36px)}
@media(min-width:640px){.estante{grid-template-columns:repeat(3,1fr)}}
@media(min-width:980px){.estante{grid-template-columns:repeat(4,1fr)}}
.ed figcaption{margin-top:16px}
.ed .rot{font:700 .7rem/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--terracota)}
@media(prefers-color-scheme:dark){.ed .rot{color:var(--ambar)}}
.ed h3{font:600 clamp(1.05rem,2vw,1.25rem)/1.2 var(--serif);margin:6px 0 4px}
.ed .data{font-size:.84rem;color:var(--tinta-2)}
.ed .desc{font-size:.88rem;color:var(--tinta-2);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ed .mini{display:flex;gap:14px;margin-top:8px}
.ed .mini a,.ed .mini button{font:600 .8rem/1 var(--sans);min-height:36px;display:inline-flex;align-items:center;gap:6px;color:var(--tinta-2);text-decoration:none}
.ed .mini a:hover,.ed .mini button:hover{color:var(--terracota)}
.vazio-busca{grid-column:1/-1;text-align:center;padding:30px;color:var(--tinta-2);font:italic 1.1rem var(--serif)}

/* ═════════ Eventos (ensaio fotográfico) ═════════ */
.ensaios{display:grid;gap:clamp(36px,6vw,64px)}
.ensaio{display:grid;gap:18px 40px;align-items:start}
@media(min-width:860px){.ensaio{grid-template-columns:1.55fr 1fr}.ensaio:nth-child(even){grid-template-columns:1fr 1.55fr}.ensaio:nth-child(even) .fotos{order:2}}
.ensaio>*{min-width:0}
.fotos{display:flex;flex-wrap:wrap;gap:var(--gap,8px);min-width:0;align-content:flex-start}
.foto{position:relative;display:block;flex:none;overflow:hidden;border-radius:4px;background:var(--papel-2);width:calc(150px * var(--r));height:150px}
.foto img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.foto:hover img{transform:scale(1.03)}
.fotos .mais{position:absolute;inset:0;display:grid;place-items:center;background:rgb(35 25 21/.62);color:#FFF5EC;font:800 1.4rem var(--serif)}
.ensaio .texto{padding-top:4px}
.ensaio .data-ev{display:flex;align-items:baseline;gap:10px;color:var(--oliva)}
.ensaio .data-ev b{font:800 3.2rem/.9 var(--serif)}
.ensaio .data-ev span{font:700 .74rem/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.ensaio h3{font:800 clamp(1.6rem,3.4vw,2.3rem)/1.05 var(--serif);letter-spacing:-.02em;margin:12px 0 12px;text-wrap:balance}
.ensaio .desc{font:400 1.06rem/1.6 var(--serif);color:var(--tinta-2)}
.ensaio .legenda{margin-top:14px;font:600 .74rem/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-2)}
.ev-tipo{border:1px solid var(--fio);border-left:4px solid var(--oliva);border-radius:4px;padding:24px;background:color-mix(in srgb,var(--oliva) 7%,var(--papel))}
.agenda-lista{display:grid;gap:12px}
@media(min-width:720px){.agenda-lista{grid-template-columns:repeat(2,1fr)}}
.ev-tipo{display:flex;gap:18px;align-items:center}
.ev-tipo .dia{text-align:center;min-width:58px;color:var(--oliva)}
.ev-tipo .dia b{display:block;font:800 2.4rem/.9 var(--serif)}
.ev-tipo .dia span{font:700 .68rem/1 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.ev-tipo h3{font:700 1.2rem/1.2 var(--serif)}
.ev-tipo p{font-size:.9rem;color:var(--tinta-2);margin-top:4px}

/* ═════════ Expediente ═════════ */
.expediente{margin-top:clamp(40px,7vw,80px);background:var(--terracota-esc);color:#F0DFD0}
.expediente .wrap{display:grid;gap:22px;padding-top:44px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
@media(min-width:720px){.expediente .wrap{grid-template-columns:1.3fr 1fr 1fr;align-items:end}}
.expediente .np{font:900 3.4rem/.85 var(--serif);letter-spacing:-.04em;color:var(--ambar)}
.expediente p{font-size:.88rem;opacity:.82}
.expediente .faixa{display:flex;gap:5px;margin-top:14px}.expediente .faixa i{width:30px;height:4px;border-radius:2px}
.expediente a{color:#F0DFD0}

/* ═════════ Leitor de PDF ═════════ */
.leitor{position:fixed;inset:0;z-index:60;background:var(--papel);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.7,.2,1);visibility:hidden}
.leitor.open{transform:none;visibility:visible}
.leitor-bar{display:flex;align-items:center;gap:12px;padding:10px clamp(12px,3vw,24px);border-bottom:1px solid var(--fio);background:var(--papel)}
.leitor-bar .x{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--fio)}
.leitor-bar .t{flex:1;min-width:0}
.leitor-bar .t small{display:block;font:700 .66rem/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--oliva)}
.leitor-bar .t b{display:block;font:700 1.05rem/1.3 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leitor-bar .ac{display:flex;gap:4px}
.leitor-bar .ac a,.leitor-bar .ac button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--tinta-2)}
.leitor-bar .ac a:hover,.leitor-bar .ac button:hover{background:var(--papel-2);color:var(--tinta)}
.leitor-corpo{flex:1;position:relative;background:var(--papel-2)}
.leitor-corpo iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.leitor-aviso{position:absolute;inset:auto 0 0;padding:10px 16px;text-align:center;font-size:.82rem;color:var(--tinta-2);background:color-mix(in srgb,var(--papel) 90%,transparent)}
@media(min-width:760px){.leitor-aviso{display:none}}

/* ═════════ Lightbox ═════════ */
.lightbox{position:fixed;inset:0;z-index:100;background:rgb(18 12 9/.94);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.lightbox.open{opacity:1;pointer-events:auto}
.lightbox figure{display:flex;flex-direction:column;align-items:center;gap:14px}
.lightbox img{max-width:92vw;max-height:80vh;object-fit:contain;border-radius:2px;box-shadow:0 20px 60px rgb(0 0 0/.5)}
.lightbox figcaption{color:#F0DFD0;font:italic 400 1rem var(--serif);text-align:center;padding:0 60px}
.lightbox figcaption b{font:700 .72rem var(--sans);letter-spacing:.14em;margin-left:10px;color:var(--ambar);font-style:normal}
.lightbox .close,.lightbox .nav-lb{position:absolute;width:52px;height:52px;border-radius:50%;background:rgb(255 255 255/.1);color:#fff;display:grid;place-items:center;font-size:1.6rem}
.lightbox .close:hover,.lightbox .nav-lb:hover{background:rgb(255 255 255/.2)}
.lightbox .close{top:18px;right:18px}
.lightbox .nav-lb{top:50%;transform:translateY(-50%)}
.lightbox .prev{left:16px}.lightbox .next{right:16px}
@media(max-width:600px){.lightbox .nav-lb{top:auto;bottom:22px;transform:none}.lightbox .prev{left:calc(50% - 64px)}.lightbox .next{right:calc(50% - 64px)}.lightbox figcaption{padding:0 16px}}

/* ═════════ Estados ═════════ */
.vazio{text-align:center;padding:80px 20px;color:var(--tinta-2)}
.vazio h2{font:800 2rem var(--serif);color:var(--tinta);margin-bottom:8px}
.carregando{display:grid;gap:16px;padding:40px 0}
.carregando i{display:block;height:18px;border-radius:4px;background:linear-gradient(90deg,var(--papel-2),var(--fio),var(--papel-2));background-size:200% 100%;animation:brilho 1.2s infinite}
@keyframes brilho{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--tinta);color:var(--papel);padding:12px 20px;border-radius:99px;font:600 .88rem var(--sans);opacity:0;transition:all .2s;z-index:200;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.revela{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
.revela.vis{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}.revela{opacity:1;transform:none}}
</style>
</head>
<body>
<header class="topo" id="topo">
  <div class="wrap">
    <a class="marca" href="#inicio" aria-label="Voltar ao início">ESPRO</a>
    <nav aria-label="Seções">
      <a href="#edicoes" data-sec="edicoes">Edições</a>
      <a href="#eventos" data-sec="eventos">Eventos</a>
    </nav>
  </div>
</header>

<main id="app" class="wrap">
  <div class="carregando" aria-label="Carregando"><i style="width:60%"></i><i style="width:90%;height:120px"></i><i style="width:40%"></i></div>
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Fotos do evento">
  <button class="close" aria-label="Fechar">&times;</button>
  <button class="nav-lb prev" aria-label="Foto anterior">&#8249;</button>
  <figure><img src="" alt=""><figcaption id="lb-cap"></figcaption></figure>
  <button class="nav-lb next" aria-label="Próxima foto">&#8250;</button>
</div>

<div class="leitor" id="leitor" role="dialog" aria-modal="true" aria-labelledby="leitor-t">
  <div class="leitor-bar">
    <button class="x" id="leitor-x" aria-label="Fechar a leitura">&#8249;</button>
    <div class="t"><small id="leitor-k">Lendo agora</small><b id="leitor-t"></b></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   Vitrine pública da Revista ESPRO — edições (PDF) e eventos (fotos).
   Dados: /api/vitrine (servidor) ou, sem servidor, o próprio app no navegador.
   ═══════════════════════════════════════════════════════════════ */
const $ = (s, r = document) => r.querySelector(s);

  download: 'M12 3v12M7 10l5 5 5-5M5 21h14',
  share: 'M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13',
  expand: 'M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7',

const MARCA = ['#F0DFD0', '#E4A558', '#A49F4F', '#B04E37'];

/* ───── Dados ───── */
const DB_NAME = 'espro', KV = 'kv';
let fonte = 'api';
function filtrar(state) {                     // mesmas regras do servidor
  return {
    ...state,
    edicoes: (state.edicoes || []).filter(e => e && e.pdf && e.status === 'publicada'),
    galeria: (state.galeria || []).filter(g => g && !g.oculto),

}

  } catch {}

    const db = await new Promise((res, rej) => { const r = indexedDB.open(DB_NAME, 1); r.onupgradeneeded = () => r.result.createObjectStore(KV); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });

}
const pdfUrl = (e, baixar) => `/api/vitrine/pdf/${encodeURIComponent(e.id)}${baixar ? '?baixar=1' : ''}`;
const nomeEd = e => `Edição nº ${e.numero}`;
const tituloEd = e => (e.nome ? `${nomeEd(e)} — ${e.nome}` : nomeEd(e));

const dt = s => (s ? new Date(s + 'T00:00') : null);
const fmtData = s => (s ? dt(s).toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' }) : '');

let toastT;
function toast(msg) {
  let t = $('.toast'); if (!t) { t = h('div', { class: 'toast', role: 'status', 'aria-live': 'polite' }); document.body.append(t); }
  t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200);
}
async function compartilhar(titulo, hash) {

  try { await navigator.clipboard.writeText(link); toast('Link copiado'); } catch { prompt('Copie o link:', link); }
}

/* ───── Capa desenhada ───── */
function capa(e, empresa) {

const capaLink = (e, empresa) => h('a', { class: 'capa-link', href: '#edicao-' + e.numero, 'aria-label': 'Ler ' + tituloEd(e),

/* ───── Lightbox ───── */
let lb = { fotos: [], i: 0, titulo: '' };
const lbEl = $('#lightbox'), lbImg = $('img', lbEl);

}
const navLb = d => { lb.i = (lb.i + d + lb.fotos.length) % lb.fotos.length; mostraLb(); };

lbEl.addEventListener('touchstart', e => { lbX = e.touches[0].clientX; }, { passive: true });

/* ───── Leitor de PDF ───── */

/* ───── Fotos adaptativas: galeria "justificada" de revista ─────
   Cada foto mantém a proporção real (nada é cortado nem desfocado). As fotos são arrumadas em
   linhas que preenchem a largura exata: a 1ª linha é alta (destaque), as demais menores. */
function moldura(src, i, total, titulo, fotos, extra) {
  const img = h('img', { src, alt: '', loading: i ? 'lazy' : 'eager', decoding: 'async' });
  const b = h('button', { type: 'button', class: 'foto', 'aria-label': `Ver foto ${i + 1} de ${total} — ${titulo}`, onclick: () => openLb(fotos, i, titulo) }, img, extra);
  b._r = 4 / 3;
  return { b, img };
}
function arrumar(box) {
  const W = box.clientWidth; if (!W) return;
  const gap = 8, itens = box._itens, alto = Math.min(innerHeight * .62, 520), baixo = Math.min(Math.max(W / 4.2, 110), 190);
  const larg = row => row.reduce((s, it) => s + it._r, 0);
  const rows = [];
  for (let i = 0; i < itens.length;) {                                      // monta as linhas
    const alvo = rows.length ? baixo : alto, row = [];
    while (i < itens.length) { row.push(itens[i++]); if (larg(row) * alvo + gap * (row.length - 1) >= W) break; }
    rows.push(row);
  }
  const ult = rows[rows.length - 1];                                         // última linha incompleta: junta à anterior se couber bem
  if (rows.length > 1 && larg(ult) * baixo + gap * (ult.length - 1) < W) {
    const junta = [...rows[rows.length - 2], ...ult];
    const ant = rows[rows.length - 2], hAnt = Math.min(rows.length > 2 ? baixo : alto, (W - gap * (ant.length - 1)) / larg(ant));
    if ((W - gap * (junta.length - 1)) / larg(junta) >= Math.max(90, hAnt * .75)) { rows.pop(); rows[rows.length - 1] = junta; }
  }
  rows.forEach((row, n) => {
    const alvo = n ? baixo : alto, soma = larg(row);
    const cheia = soma * alvo + gap * (row.length - 1) >= W;
    const hgt = cheia ? (W - gap * (row.length - 1)) / soma : alvo;
    let usado = 0;
    row.forEach((it, k) => {
      const w = cheia && k === row.length - 1 ? W - usado - gap * k : Math.floor(it._r * hgt);
      it.style.width = w + 'px'; it.style.height = Math.round(hgt) + 'px'; usado += w;
    });
  });
}

  box._itens = ms.map(m => m.b);
  box.append(...box._itens);
  ms.forEach(({ b, img }) => {
    const ok = () => { if (img.naturalWidth) { b._r = img.naturalWidth / img.naturalHeight; arrumar(box); } };
    img.complete ? ok() : img.addEventListener('load', ok, { once: true });
  });

}

/* ═════════ Render ═════════ */
let STATE = null, busca = '', ano = '';

        h('a', { class: 'link', href: pdfUrl(atual, true), download: `revista-espro-${atual.numero}.pdf` }, svgIcon(ICONS.download, 16), 'Baixar PDF'),
        h('button', { class: 'link', type: 'button', onclick: () => compartilhar(tituloEd(atual), '#edicao-' + atual.numero) }, svgIcon(ICONS.share, 16), 'Compartilhar')))) : null;

  /* arquivo */

  const anos = [...new Set(anteriores.map(e => (e.data || '').slice(0, 4)).filter(Boolean))].sort().reverse();

  const arquivo = anteriores.length ? h('section', { class: 'secao', id: 'edicoes' },
    h('div', { class: 'secao-cab revela' }, h('span', { class: 'n' }, String(++sec).padStart(2, '0')), h('h2', {}, 'Edições anteriores'),
      h('p', {}, `${anteriores.length} ${anteriores.length === 1 ? 'edição' : 'edições'} no acervo — toque na capa para ler.`)),
    anteriores.length > 4 ? h('div', { class: 'ferr' },
      h('label', {}, h('span', { class: 'sr' }, 'Buscar edição'), svgIcon(ICONS.search, 18),
        h('input', { type: 'search', placeholder: 'Buscar no acervo…', value: busca, oninput: ev => { busca = ev.target.value; clearTimeout(window._bt); window._bt = setTimeout(() => desenharEstante(), 180); } })),
      anos.length > 1 ? h('div', { class: 'anos', role: 'group', 'aria-label': 'Filtrar por ano' },

    h('div', { class: 'estante', id: 'estante' })) : null;

      h('p', {}, 'Os encontros da equipe, em fotos.')),
    ensaios.length ? h('div', { class: 'ensaios' }, ...ensaios.map(g => {

      const d = dt(g.data);

          h('h3', {}, g.titulo),

    h('div', {}, h('p', { class: 'kicker', style: 'color:#E4A558;margin-bottom:8px' }, 'Expediente'), h('p', {}, 'Revista interna da equipe ', empresa, '. Edições em PDF e registros dos nossos eventos.')),
    h('div', {}, h('p', {}, `${todas.length} ${todas.length === 1 ? 'edição' : 'edições'} · ${nEventos} ${nEventos === 1 ? 'evento' : 'eventos'}`), h('p', {}, h('a', { href: '#inicio' }, 'Voltar ao topo ↑')))));

/* revelação suave ao rolar + seção ativa no menu */
let io;
function observar() {
  io?.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('vis'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' });
  $$('.revela:not(.vis)').forEach(el => (el.getBoundingClientRect().top < innerHeight ? el.classList.add('vis') : io.observe(el)));   // 1ª tela aparece já
  const secs = $$('#edicoes,#eventos');
  const io2 = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) $$('.topo nav a').forEach(a => a.classList.toggle('on', a.dataset.sec === e.target.id)); }), { rootMargin: '-40% 0px -55% 0px' });
  secs.forEach(s => io2.observe(s));
}
addEventListener('scroll', () => $('#topo').classList.toggle('sombra', scrollY > 160), { passive: true });

function abrirPorHash() {
  const m = /^#edicao-(\d+)$/.exec(location.hash);
  const e = m && STATE?.edicoes.find(x => String(x.numero) === m[1]);
  if (e) abrirLeitor(e);
}
addEventListener('hashchange', abrirPorHash);

(async () => {
  STATE = await carregarDados();
  window._midia = STATE.midia || {};
  render();
  abrirPorHash();
})();
</script>
